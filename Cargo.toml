[package]
name = "opentty"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "GPU-accelerated native Wayland + Vulkan terminal emulator for CachyOS / KDE Plasma"
license = "MIT"

[dependencies]
ash = "0.38"
env_logger = "0.11"
fontdb = "0.22"
fontdue = "0.9"
log = "0.4"
nix = { version = "0.29", features = ["fs", "ioctl", "poll", "process", "signal", "term"] }
vte = "0.14"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
xkbcommon = "0.8"

[build-dependencies]
naga = { version = "24.0", features = ["spv-out", "wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
